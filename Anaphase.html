<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Lesson</title><script type="module" src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#edf3f5;color:#16333d;font:16px system-ui,'Nirmala UI',sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;gap:12px}h1{font-size:22px;margin:0}button,select{font:inherit;border:1px solid #b0c6cd;background:white;color:#16333d;padding:9px 12px;border-radius:8px;cursor:pointer}button:disabled{opacity:.45}button:focus-visible,input:focus-visible{outline:3px solid #e2a83b}main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;padding:0 12px}main.wide{grid-template-columns:1fr}#stage{background:#173443;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;height:78vh;min-height:360px}model-viewer{width:100%;flex:1;min-height:0;background:radial-gradient(ellipse,#547483,#172f40)}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;background:#f6fafb}.timeline{display:flex;align-items:center;gap:10px;flex:1 0 100%}.timeline input{flex:1;min-width:90px;accent-color:#077d83}output{font-size:13px;font-variant-numeric:tabular-nums}#panel{background:white;border-radius:14px;overflow:auto;padding:16px;max-height:78vh}.panelTop{display:flex;justify-content:flex-end;gap:8px}p{line-height:1.65;white-space:pre-wrap}#parts button{display:block;width:100%;text-align:left;margin:7px 0}.hot{font-size:12px;padding:5px 8px;background:#fffbea;color:#18343c;border:1px solid #c4a850}#stage:fullscreen{height:100dvh;width:100%;border-radius:0}#panel:fullscreen{max-height:none;width:100%;height:100%;padding:28px;background:white}#status,#speechStatus{font-size:13px;padding:0 18px}footer{text-align:center;padding:14px;font-size:12px;color:#526c74}[hidden]{display:none!important}#voice{max-width:100%;width:100%;margin-top:8px}#actions{display:flex;gap:6px;flex-wrap:wrap}@media(max-width:760px){main{grid-template-columns:1fr}#stage{height:63dvh}#panel{max-height:none}h1{font-size:18px}.controls button,.controls select{padding:8px} }
</style></head><body><header><h1 id="heading">3D Lesson</h1><button id="lang">বাংলা</button></header><p id="status" role="status"></p><button id="restore" hidden>Show animation</button><main id="layout"><section id="stage"><model-viewer id="viewer" camera-controls touch-action="pan-y" shadow-intensity="0.3" animation-crossfade-duration="0" alt="Interactive teaching model"></model-viewer><div class="controls"><div class="timeline"><input id="seek" aria-label="Animation timeline" type="range" min="0" max="1" step="0.01" value="0"><output id="time">0.0 / 0.0 s</output></div><button id="play" disabled>▶ Play</button><select id="speed" aria-label="Animation speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><button id="details">Details</button><button id="full" aria-label="Animation fullscreen">⛶</button><button id="closeStage" aria-label="Close animation">×</button><div id="actions"></div></div></section><aside id="panel"><div class="panelTop"><button id="fullDetails" aria-label="Details fullscreen">⛶</button><button id="closeDetails" aria-label="Close details">×</button></div><h2 id="title"></h2><p id="description"></p><button id="read">▶ Read</button><select id="voice" aria-label="Reading voice"></select><p id="speechStatus" role="status"></p><div id="parts"></div></aside></main><footer id="copyright"></footer><script id="lesson" type="application/json">{"id":"model-1790604731384","src":"anaphase.glb","title":{"en":"Mitosis Anaphase","bn":"মাইটোসিসের অ্যানাফেজ দশা"},"description":{"en":"মাইটোসিস বিভাজনের অ্যানাফেজ (Anaphase) হলো ক্যারিওকাইনেসিসের চতুর্থ এবং সবচেয়ে গতিশীল পর্যায়। এই দশায় মূলত বোন ক্রোমাটিডগুলো আলাদা হয়ে বিপরীত মেরুর দিকে ছুটতে শুরু করে।\nঅ্যানাফেজ দশার মূল বৈশিষ্ট্য এবং এই সময়ে গঠিত বিভিন্ন প্রকার স্পিন্ডল তন্তুর (Spindle Fibres) বিস্তারিত আলোচনা নিচে দেওয়া হলো:\n## ১. অ্যানাফেজ দশার মূল বৈশিষ্ট্য\n\n* সেন্ট্রোমিয়ারের বিভাজন: প্রতিটি ক্রোমোজোমের সেন্ট্রোমিয়ারটি লম্বালম্বিভাবে দুভাগে বিভক্ত হয়ে যায়। এর ফলে দুটি বোন ক্রোমাটিড সম্পূর্ণ আলাদা হয়ে দুটি স্বাধীন অপত্য ক্রোমোজোমে (Daughter Chromosomes) পরিণত হয়।\n* মেরুমুখী চলন (Anaphasic Movement): অপত্য ক্রোমোজোমগুলোর অর্ধেক অংশ কোষের উত্তর মেরুর দিকে এবং বাকি অর্ধেক অংশ দক্ষিণ মেরুর দিকে অগ্রসর হতে থাকে। সেন্ট্রোমিয়ারটি মেরুর দিকে এগিয়ে যায় এবং বাহু দুটি পেছন পেছন অনুগামী হয়।\n* আকৃতি পরিবর্তন: চলনের সময় সেন্ট্রোমিয়ারের অবস্থান অনুযায়ী ক্রোমোজোমগুলোকে ইংরেজি অক্ষরের মতো দেখায়:\n* V-আকৃতি: মেটাসেন্ট্রিক (Metacentric)\n   * L-আকৃতি: সাব-মেটাসেন্ট্রিক (Sub-metacentric)\n   * J-আকৃতি: অ্যাক্রোসেন্ট্রিক (Acrocentric)\n   * I-আকৃতি: টেলোসেন্ট্রিক (Telocentric)\n\n------------------------------\n## ২. অ্যানাফেজ দশায় বিভিন্ন স্পিন্ডল তন্তুর ভূমিকা (Spindle Fibres Name)\nএই পর্যায়ে ক্রোমোজোমের চলন এবং কোষের কাঠামো বজায় রাখতে মূলত তিন ধরণের স্পিন্ডল তন্তু কাজ করে:\n\n* ক্রোমোজোমাল তন্তু বা ট্র্যাকশন তন্তু (Chromosomal / Traction Fibres): যে স্পিন্ডল তন্তুগুলো সরাসরি ক্রোমোজোমের কাইনেটোকোরের (Kinetochore) সাথে যুক্ত থাকে, তাদের ক্রোমোজোমাল তন্তু বলে। অ্যানাফেজ চলাকালীন এই তন্তুগুলো ছোট বা সংকুচিত হতে থাকে, যা ক্রোমোজোমগুলোকে টান দিয়ে মেরুর দিকে নিয়ে যায়।\n* নিরবচ্ছিন্ন তন্তু (Continuous / Pole-to-Pole Fibres): এই তন্তুগুলো কোনো ক্রোমোজোমের সাথে যুক্ত না হয়ে সরাসরি এক মেরু থেকে অন্য মেরু পর্যন্ত বিস্তৃত থাকে। এগুলো কোষের আকৃতি লম্বাটে করতে এবং স্পিন্ডল অ্যাপারেটাসের ভারসাম্য বজায় রাখতে সাহায্য করে।\n* ইন্টারজোনাল তন্তু (Interzonal Fibres): অ্যানাফেজের অগ্রগতির সাথে সাথে দুটি মেরুর দিকে চলে যাওয়া অপত্য ক্রোমোজোমগুলোর মধ্যবর্তী ফাঁকা স্থানে নতুন এক ধরণের তন্তু দেখা যায়। এদের ইন্টারজোনাল তন্তু বলে। এই তন্তুগুলো আকারে বড় বা প্রসারিত হয়ে ক্রোমোজোম দুটিকে পরস্পরের বিপরীত দিকে ঠেলে দিতে (Pushing effect) সাহায্য করে।\n","bn":""},"labels":[],"copyright":"© 2026 Bholanath Debnath. All rights reserved.","showStudentActions":false}</script><script>
'use strict';
const $=id=>document.getElementById(id),m=JSON.parse($('lesson').textContent),viewer=$('viewer'),synth=window.speechSynthesis;
let language='en',selected=-1,detailsOpen=true,speaking=false,speechToken=0,utterance=null,endAt=null,modelURL=null;
const tr=(en,bn)=>language==='bn'?bn:en,tx=o=>o?.[language]||o?.en||o?.bn||'';
function stopSpeech(){speechToken++;speaking=false;if(synth)synth.cancel();$('read').textContent=tr('▶ Read','▶ পড়ে শোনান');}
function voices(){const old=$('voice').value,vs=synth?synth.getVoices().filter(v=>v.lang.toLowerCase().startsWith(language)):[];vs.sort((a,b)=>Number(/google/i.test(b.name))-Number(/google/i.test(a.name)));$('voice').replaceChildren();vs.forEach(v=>$('voice').add(new Option(v.name+' · '+v.lang,v.voiceURI)));if(vs.some(v=>v.voiceURI===old))$('voice').value=old;$('read').disabled=!vs.length;$('speechStatus').textContent=vs.length?(vs.some(v=>/google/i.test(v.name))?'':tr('Using a voice available on this device.','এই ডিভাইসে উপলব্ধ কণ্ঠস্বর ব্যবহার করা হচ্ছে।')):tr('No English reading voice is available on this device.','এই ডিভাইসে বাংলা কণ্ঠস্বর পাওয়া যায়নি।');}
function render(){document.documentElement.lang=language;$('heading').textContent=tx(m.title);document.title=tx(m.title);$('lang').textContent=language==='en'?'বাংলা':'English';$('copyright').textContent=m.copyright||'© 2026 Bholanath Debnath. All rights reserved.';$('panel').hidden=!detailsOpen;$('layout').classList.toggle('wide',!detailsOpen);$('details').textContent=tr('Details','বিবরণ');$('restore').textContent=tr('Show animation','অ্যানিমেশন দেখান');const h=m.labels[selected]||m;$('title').textContent=tx(h.title);$('description').textContent=tx(h.description);$('read').textContent=speaking?tr('■ Stop reading','■ পড়া বন্ধ'):tr('▶ Read','▶ পড়ে শোনান');$('parts').replaceChildren();viewer.querySelectorAll('[slot^="hotspot-"]').forEach(b=>b.remove());(m.labels||[]).forEach((h,i)=>{const choose=()=>{stopSpeech();selected=i;detailsOpen=true;render();};const b=document.createElement('button');b.textContent=tx(h.title);b.onclick=choose;$('parts').append(b);if(h.placed!==false&&h.position){const hot=document.createElement('button');hot.className='hot';hot.slot='hotspot-'+i;hot.dataset.position=h.position;hot.dataset.normal=h.normal;hot.textContent=tx(h.title);hot.onclick=choose;viewer.append(hot);}});$('actions').replaceChildren();if(m.showStudentActions)(m.actions||[]).forEach(a=>{const b=document.createElement('button');b.textContent=tx(a.title);b.onclick=async()=>{viewer.pause();if(a.clip&&(viewer.availableAnimations||[]).includes(a.clip))viewer.animationName=a.clip;await viewer.updateComplete;if(a.orbit)viewer.cameraOrbit=a.orbit;if(a.target)viewer.cameraTarget=a.target;if(a.fov)viewer.fieldOfView=a.fov;viewer.currentTime=Math.min(a.start||0,viewer.duration||0);endAt=null;if(a.kind==='segment'){endAt=Math.min(a.end,viewer.duration);viewer.play({repetitions:1});}};$('actions').append(b);});voices();}
async function full(el){try{if(document.fullscreenElement)await document.exitFullscreen();else await el.requestFullscreen();}catch{$('status').textContent=tr('Fullscreen is unavailable in this browser.','এই ব্রাউজারে পূর্ণ পর্দা উপলব্ধ নয়।');}}
$('lang').onclick=()=>{stopSpeech();language=language==='en'?'bn':'en';render();};$('details').onclick=()=>{detailsOpen=!detailsOpen;render();};$('closeDetails').onclick=async()=>{stopSpeech();if(document.fullscreenElement===$('panel'))await document.exitFullscreen();detailsOpen=false;render();};$('full').onclick=()=>full($('stage'));$('fullDetails').onclick=()=>full($('panel'));$('closeStage').onclick=async()=>{viewer.pause();if(document.fullscreenElement===$('stage'))await document.exitFullscreen();$('stage').hidden=true;$('restore').hidden=false;};$('restore').onclick=()=>{$('stage').hidden=false;$('restore').hidden=true;};
$('play').onclick=()=>{endAt=null;if(viewer.paused){if(viewer.currentTime>=viewer.duration-.02)viewer.currentTime=0;viewer.play({repetitions:1});}else viewer.pause();};$('seek').oninput=e=>{viewer.pause();endAt=null;viewer.currentTime=Number(e.target.value);};$('speed').onchange=e=>viewer.timeScale=Number(e.target.value);
$('read').onclick=()=>{if(speaking){stopSpeech();return;}const v=synth?.getVoices().find(v=>v.voiceURI===$('voice').value);if(!v)return;stopSpeech();speaking=true;const token=speechToken,h=m.labels[selected]||m,text=tx(h.title)+'. '+tx(h.description),chunks=text.match(/[^.!?।\n]+[.!?।\n]*/g)||[text];$('read').textContent=tr('■ Stop reading','■ পড়া বন্ধ');function next(){if(token!==speechToken)return;const chunk=chunks.shift();if(!chunk){stopSpeech();return;}utterance=new SpeechSynthesisUtterance(chunk);utterance.voice=v;utterance.lang=v.lang;utterance.rate=.9;utterance.onend=next;utterance.onerror=()=>{if(token===speechToken){stopSpeech();$('speechStatus').textContent=tr('Reading voice could not start.','কণ্ঠস্বর চালু হয়নি।');}};synth.speak(utterance);}next();};$('voice').onchange=stopSpeech;if(synth)synth.addEventListener('voiceschanged',voices);window.addEventListener('pagehide',()=>{stopSpeech();if(modelURL)URL.revokeObjectURL(modelURL);});
viewer.addEventListener('load',async()=>{const clips=viewer.availableAnimations||[];if(clips.length){viewer.animationName=clips[0];await viewer.updateComplete;viewer.pause();viewer.currentTime=0;}$('status').textContent=clips.length?'':tr('This model has no animation tracks.','এই মডেলে অ্যানিমেশন নেই।');});viewer.addEventListener('error',()=>{$('status').textContent=tr('Model could not load. Check the GLB file and internet connection.','মডেল লোড হয়নি। GLB ফাইল ও ইন্টারনেট সংযোগ পরীক্ষা করুন।');});
function tick(){const has=(viewer.availableAnimations||[]).length>0,t=viewer.currentTime||0,d=viewer.duration||0;for(const id of ['play','seek','speed'])$(id).disabled=!has;$('seek').max=d||1;$('seek').value=t;$('time').textContent=t.toFixed(1)+' / '+d.toFixed(1)+' s';$('play').textContent=viewer.paused?tr('▶ Play','▶ চালু'):tr('❚❚ Pause','❚❚ বিরতি');if(endAt!==null&&t>=endAt-.025){viewer.pause();viewer.currentTime=endAt;endAt=null;}requestAnimationFrame(tick);}render();requestAnimationFrame(tick);
customElements.whenDefined('model-viewer').then(()=>{if(m.embeddedGLB){const b=atob(m.embeddedGLB),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);modelURL=URL.createObjectURL(new Blob([a],{type:'model/gltf-binary'}));viewer.src=modelURL;}else{viewer.src=m.src;if(location.protocol==='file:')$('status').textContent=tr('Use the embedded HTML for double-click viewing, or serve this separate-GLB edition through localhost / GitHub Pages.','ডাবল-ক্লিকে দেখার জন্য embedded HTML ব্যবহার করুন, অথবা এই সংস্করণ localhost / GitHub Pages-এ চালান।');}});setTimeout(()=>{if(!customElements.get('model-viewer'))$('status').textContent=tr('Internet is required to load the 3D viewer. Reconnect and reload.','৩ডি ভিউয়ার লোড করতে ইন্টারনেট প্রয়োজন। সংযোগ দিয়ে আবার খুলুন।');},12000);
</script></body></html>
