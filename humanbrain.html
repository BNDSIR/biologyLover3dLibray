*{box-sizing:border-box}body{margin:0;background:#edf3f5;color:#16333d;font:16px system-ui,'Nirmala UI',sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;gap:12px}h1{font-size:22px;margin:0}button,select{font:inherit;border:1px solid #b0c6cd;background:white;color:#16333d;padding:9px 12px;border-radius:8px;cursor:pointer}button:disabled{opacity:.45}button:focus-visible,input:focus-visible{outline:3px solid #e2a83b}main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;padding:0 12px}main.wide{grid-template-columns:1fr}#stage{background:#173443;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;height:78vh;min-height:360px}model-viewer{width:100%;flex:1;min-height:0;background:radial-gradient(ellipse,#547483,#172f40)}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;background:#f6fafb}.timeline{display:flex;align-items:center;gap:10px;flex:1 0 100%}.timeline input{flex:1;min-width:90px;accent-color:#077d83}output{font-size:13px;font-variant-numeric:tabular-nums}#panel{background:white;border-radius:14px;overflow:auto;padding:16px;max-height:78vh}.panelTop{display:flex;justify-content:flex-end;gap:8px}p{line-height:1.65;white-space:pre-wrap}#parts button{display:block;width:100%;text-align:left;margin:7px 0}.hot{font-size:12px;padding:5px 8px;background:#fffbea;color:#18343c;border:1px solid #c4a850}#stage:fullscreen{height:100dvh;width:100%;border-radius:0}#panel:fullscreen{max-height:none;width:100%;height:100%;padding:28px;background:white}#status,#speechStatus{font-size:13px;padding:0 18px}footer{text-align:center;padding:14px;font-size:12px;color:#526c74}[hidden]{display:none!important}#voice{max-width:100%;width:100%;margin-top:8px}#actions{display:flex;gap:6px;flex-wrap:wrap}@media(max-width:760px){main{grid-template-columns:1fr}#stage{height:63dvh}#panel{max-height:none}h1{font-size:18px}.controls button,.controls select{padding:8px} }
.hot{width:12px;height:12px;min-width:12px;padding:0!important;border-radius:50%;background:#ffdc75;overflow:visible;border:2px solid white}.hot::before{content:"";position:absolute;left:7px;bottom:6px;width:34px;height:2px;background:#ffdc75;transform:rotate(-45deg);transform-origin:left center;pointer-events:none}.hot .caption{position:absolute;left:28px;bottom:27px;white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis;background:#fffbea;color:#173443;padding:6px 9px;border-radius:6px;border:1px solid #b49a50;font-size:12px}.hot:focus-visible{outline:3px solid #21bed0}</style></head><body><header><h1 id="heading">3D Lesson</h1><button id="lang">বাংলা</button></header><p id="status" role="status"></p><button id="restore" hidden>Show animation</button><main id="layout"><section id="stage"><model-viewer id="viewer" camera-controls touch-action="pan-y" shadow-intensity="0.3" animation-crossfade-duration="0" alt="Interactive teaching model"></model-viewer><div class="controls"><div class="timeline"><input id="seek" aria-label="Animation timeline" type="range" min="0" max="1" step="0.01" value="0"><output id="time">0.0 / 0.0 s</output></div><button id="play" disabled>▶ Play</button><select id="speed" aria-label="Animation speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><button id="details">Details</button><button id="full" aria-label="Animation fullscreen">⛶</button><button id="closeStage" aria-label="Close animation">×</button><div id="actions"></div></div></section><aside id="panel"><div class="panelTop"><button id="fullDetails" aria-label="Details fullscreen">⛶</button><button id="closeDetails" aria-label="Close details">×</button></div><h2 id="title"></h2><p id="description"></p><button id="read">▶ Read</button><select id="voice" aria-label="Reading voice"></select><p id="speechStatus" role="status"></p><div id="parts"></div></aside></main><footer id="copyright"></footer><script id="lesson" type="application/json">{"id":"neuron","src":"humanbrain.glb","title":{"en":"Human Brain","bn":""},"description":{"en":"নিচে মানব মস্তিষ্কের গঠন ও কাজ পয়েন্ট আকারে বিস্তারিত (In-detail) আলোচনা করা হলো:\n১. সাধারণ গঠন এবং সুরক্ষা (General Structure and Protection)\n• ওজন: একজন প্রাপ্তবয়স্ক মানুষের মস্তিষ্কের ওজন প্রায় ১.৩৬ কেজি (দেহের মোট ওজনের প্রায় ২%)।\n• করোটি (Cranium): মস্তিষ্কটি মাথার শক্ত হাড়ের তৈরি বাক্স বা করোটীর (skull) ভেতরে সুরক্ষিত থাকে।\n• মেনিনজেস (Meninges): মস্তিষ্কটি তিন স্তরবিশিষ্ট একটি পর্দা দ্বারা আবৃত থাকে, যাকে মেনিনজেস বলে। এর তিনটি স্তর হলো— ড্যুরা মেটার (Dura mater), অ্যারাকনয়েড মেটার (Arachnoid mater) এবং পিয়া মেটার (Pia mater)।\n• সেরিব্রোস্পাইনাল ফ্লুইড (Cerebrospinal Fluid - CSF): মস্তিষ্কের ভেতরে এবং মেনিনজেসের স্তরের মাঝে এক ধরণের তরল থাকে, যা মস্তিষ্ককে বাইরের আঘাত থেকে রক্ষা করে এবং পুষ্টি জোগায়।\n২. মস্তিষ্কের প্রধান তিনটি অংশ (Three Main Parts of the Brain)\nমানব মস্তিষ্ক মূলত তিনটি প্রধান অংশে বিভক্ত: অগ্রমস্তিষ্ক (Forebrain), মধ্যমস্তিষ্ক (Midbrain) এবং পশ্চাৎমস্তিষ্ক (Hindbrain)।\nক) অগ্রমস্তিষ্ক (Forebrain / Prosencephalon)\nএটি মস্তিষ্কের সবচেয়ে বড় এবং উন্নত অংশ। এর প্রধান অংশগুলো হলো:\n• সেরিব্রাম (Cerebrum): এটি মস্তিষ্কের মূল অংশ (প্রায় ৮০%)। এটি লম্বালম্বিভাবে দুটি ভাগে বিভক্ত, যাদের সেরিব্রাল হেমিস্ফিয়ার (Cerebral Hemispheres) বলে। এরা কর্পাস ক্যালোসাম (Corpus Callosum) নামক স্নায়ুতন্তু দ্বারা যুক্ত থাকে।\n\t• কাজ: বুদ্ধিমত্তা, স্মৃতিশক্তি, চিন্তাভাবনা, যুক্তি, এবং ইচ্ছাধীন পেশীর চলাচল নিয়ন্ত্রণ করা।\n• থ্যালামাস (Thalamus): এটি সেরিব্রামের ঠিক নিচে অবস্থিত।\n\t• কাজ: এটি একটি রিলে স্টেশন (Relay Station) হিসেবে কাজ করে। চাপ, স্পর্শ এবং ব্যথার মতো সংজ্ঞাবহ অনুভূতিগুলো এখানে এসে সেরিব্রামে পৌঁছায়।\n• হাইপোথ্যালামাস (Hypothalamus): থ্যালামাসের নিচে অবস্থিত ছোট একটি অংশ।\n\t• কাজ: দেহের তাপমাত্রা নিয়ন্ত্রণ, ক্ষুধা-তৃষ্ণা, ঘুম এবং আবেগ (রাগ, ভয়, আনন্দ) নিয়ন্ত্রণ করে। এছাড়া এটি পিটুইটারি গ্রন্থি (Pituitary Gland) নিয়ন্ত্রণের মাধ্যমে হরমোন ক্ষরণ পরিচালনা করে।\nখ) মধ্যমস্তিষ্ক (Midbrain / Mesencephalon)\nএটি অগ্রমস্তিষ্ক এবং পশ্চাৎমস্তিষ্কের সংযোগস্থলে অবস্থিত একটি ছোট অংশ।\n• কাজ: এটি মূলত দর্শন (Vision) এবং শ্রবণ (Hearing) সংকেত প্রক্রিয়াকরণ ও প্রতিফলিত ক্রিয়ার (reflex movements) কেন্দ্র হিসেবে কাজ করে।\nগ) পশ্চাৎমস্তিষ্ক (Hindbrain / Rhombencephalon)\nএটি মস্তিষ্কের পেছনের ও নিচের অংশ। এর তিনটি মূল উপাদান রয়েছে:\n• সেরিবেলাম (Cerebellum): একে 'ছোট মস্তিষ্ক' বলা হয়। এটি সেরিব্রামের নিচে এবং পেছনের দিকে থাকে।\n\t• কাজ: দেহের ভারসাম্য (Balance) রক্ষা করা, পেশীর টান নিয়ন্ত্রণ করা এবং হাঁটা-চলার সমন্বয় সাধন করা।\n• পনস (Pons): এটি মধ্যমস্তিষ্ক ও মেডুলার মাঝখানে অবস্থিত।\n\t• কাজ: এটি মস্তিষ্কের বিভিন্ন অংশের মধ্যে সংকেত আদান-প্রদান করে এবং শ্বাসক্রিয়ার হার নিয়ন্ত্রণে সাহায্য করে।\n• মেডুলা অবলংগাটা (Medulla Oblongata): এটি মস্তিষ্কের একবারে শেষ অংশ, যা নিচে সুষুম্নাকাণ্ড বা স্পাইনাল কর্ডের (Spinal Cord) সাথে যুক্ত থাকে।\n\t• কাজ: দেহের অত্যন্ত গুরুত্বপূর্ণ অবশংভড বা স্বয়ংক্রিয় ক্রিয়াকলাপ যেমন— হৃৎস্পন্দন (Heart rate), শ্বাস-প্রশ্বাস (Breathing), রক্তচাপ, গিলতে সাহায্য করা এবং বমি হওয়া নিয়ন্ত্রণ করে।\n৩. ব্রেন স্টেম (Brain Stem)\n• মধ্যমস্তিষ্ক, পনস এবং মেডুলা অবলংগাটা— এই তিনটি অংশকে একত্রে ব্রেন স্টেম বলা হয়।\n• এটি পুরো মস্তিষ্ককে সুষুম্নাকাণ্ডের সাথে যুক্ত করে এবং জীবনধারণের জন্য প্রয়োজনীয় বেসিক রিফ্লেক্সগুলো নিয়ন্ত্রণ করে।\n৪. ধূসর বস্তু এবং শ্বেত বস্তু (Gray Matter and White Matter)\n• গ্রে ম্যাটার (Gray Matter): মস্তিষ্কের বাইরের স্তরে (সেরিব্রাল কর্টেক্স) নিউরনের সাইটন বা কোষদেহগুলো (Cell bodies) ঘন অবস্থায় থাকে, যা দেখতে ধূসর রঙের হয়। এখানে সমস্ত তথ্য প্রক্রিয়াকরণ হয়।\n• হোয়াইট ম্যাটার (White Matter): মস্তিষ্কের ভেতরের অংশে নিউরনের মায়েলিন আবৃত এক্সনগুলো (Axons) থাকে, যা দেখতে সাদা হয়। এটি মস্তিষ্কের বিভিন্ন অংশের মধ্যে যোগাযোগ তৈরি করে।\n","bn":""},"labels":[],"sceneIndex":0,"copyright":"© 2026 Bholanath Debnath. All rights reserved.","showStudentActions":false}</script><script>
'use strict';
const $=id=>document.getElementById(id),m=JSON.parse($('lesson').textContent),viewer=$('viewer'),synth=window.speechSynthesis;
let language='en',selected=-1,detailsOpen=true,speaking=false,speechToken=0,utterance=null,endAt=null,modelURL=null;
const tr=(en,bn)=>language==='bn'?bn:en,tx=o=>o?.[language]||o?.en||o?.bn||'';
function stopSpeech(){speechToken++;speaking=false;if(synth)synth.cancel();$('read').textContent=tr('▶ Read','▶ পড়ে শোনান');}
function voices(){const old=$('voice').value,vs=synth?synth.getVoices().filter(v=>v.lang.toLowerCase().startsWith(language)):[];vs.sort((a,b)=>Number(/google/i.test(b.name))-Number(/google/i.test(a.name)));$('voice').replaceChildren();vs.forEach(v=>$('voice').add(new Option(v.name+' · '+v.lang,v.voiceURI)));if(vs.some(v=>v.voiceURI===old))$('voice').value=old;$('read').disabled=!vs.length;$('speechStatus').textContent=vs.length?(vs.some(v=>/google/i.test(v.name))?'':tr('Using a voice available on this device.','এই ডিভাইসে উপলব্ধ কণ্ঠস্বর ব্যবহার করা হচ্ছে।')):tr('No English reading voice is available on this device.','এই ডিভাইসে বাংলা কণ্ঠস্বর পাওয়া যায়নি।');}
function render(){document.documentElement.lang=language;$('heading').textContent=tx(m.title);document.title=tx(m.title);$('lang').textContent=language==='en'?'বাংলা':'English';$('copyright').textContent=m.copyright||'© 2026 Bholanath Debnath. All rights reserved.';$('panel').hidden=!detailsOpen;$('layout').classList.toggle('wide',!detailsOpen);$('details').textContent=tr('Details','বিবরণ');$('restore').textContent=tr('Show animation','অ্যানিমেশন দেখান');const h=m.labels[selected]||m;$('title').textContent=tx(h.title);$('description').textContent=tx(h.description);$('read').textContent=speaking?tr('■ Stop reading','■ পড়া বন্ধ'):tr('▶ Read','▶ পড়ে শোনান');$('parts').replaceChildren();viewer.querySelectorAll('[slot^="hotspot-"]').forEach(b=>b.remove());(m.labels||[]).forEach((h,i)=>{const choose=()=>{stopSpeech();selected=i;detailsOpen=true;render();};const b=document.createElement('button');b.textContent=tx(h.title);b.onclick=choose;$('parts').append(b);if(h.placed!==false&&h.position){const hot=document.createElement('button');hot.className='hot';hot.slot='hotspot-'+i;hot.dataset.position=h.position;hot.dataset.normal=h.normal;if(h.surface)hot.dataset.surface=h.surface;hot.textContent=tx(h.title);hot.onclick=choose;const caption=document.createElement('span');caption.className='caption';caption.textContent=hot.textContent;hot.textContent='';hot.setAttribute('aria-label',caption.textContent);hot.append(caption);viewer.append(hot);}});$('actions').replaceChildren();if(m.showStudentActions)(m.actions||[]).forEach(a=>{const b=document.createElement('button');b.textContent=tx(a.title);b.onclick=async()=>{viewer.pause();if(a.clip&&(viewer.availableAnimations||[]).includes(a.clip))viewer.animationName=a.clip;await viewer.updateComplete;if(a.orbit)viewer.cameraOrbit=a.orbit;if(a.target)viewer.cameraTarget=a.target;if(a.fov)viewer.fieldOfView=a.fov;viewer.currentTime=Math.min(a.start||0,viewer.duration||0);endAt=null;if(a.kind==='segment'){endAt=Math.min(a.end,viewer.duration);viewer.play({repetitions:1});}};$('actions').append(b);});voices();}
async function full(el){try{if(document.fullscreenElement)await document.exitFullscreen();else await el.requestFullscreen();}catch{$('status').textContent=tr('Fullscreen is unavailable in this browser.','এই ব্রাউজারে পূর্ণ পর্দা উপলব্ধ নয়।');}}
$('lang').onclick=()=>{stopSpeech();language=language==='en'?'bn':'en';render();};$('details').onclick=()=>{detailsOpen=!detailsOpen;render();};$('closeDetails').onclick=async()=>{stopSpeech();if(document.fullscreenElement===$('panel'))await document.exitFullscreen();detailsOpen=false;render();};$('full').onclick=()=>full($('stage'));$('fullDetails').onclick=()=>full($('panel'));$('closeStage').onclick=async()=>{viewer.pause();if(document.fullscreenElement===$('stage'))await document.exitFullscreen();$('stage').hidden=true;$('restore').hidden=false;};$('restore').onclick=()=>{$('stage').hidden=false;$('restore').hidden=true;};
$('play').onclick=()=>{endAt=null;if(viewer.paused){if(viewer.currentTime>=viewer.duration-.02)viewer.currentTime=0;viewer.play({repetitions:1});}else viewer.pause();};$('seek').oninput=e=>{viewer.pause();endAt=null;viewer.currentTime=Number(e.target.value);};$('speed').onchange=e=>viewer.timeScale=Number(e.target.value);
$('read').onclick=()=>{if(speaking){stopSpeech();return;}const v=synth?.getVoices().find(v=>v.voiceURI===$('voice').value);if(!v)return;stopSpeech();speaking=true;const token=speechToken,h=m.labels[selected]||m,text=tx(h.title)+'. '+tx(h.description),chunks=text.match(/[^.!?।\n]+[.!?।\n]*/g)||[text];$('read').textContent=tr('■ Stop reading','■ পড়া বন্ধ');function next(){if(token!==speechToken)return;const chunk=chunks.shift();if(!chunk){stopSpeech();return;}utterance=new SpeechSynthesisUtterance(chunk);utterance.voice=v;utterance.lang=v.lang;utterance.rate=.9;utterance.onend=next;utterance.onerror=()=>{if(token===speechToken){stopSpeech();$('speechStatus').textContent=tr('Reading voice could not start.','কণ্ঠস্বর চালু হয়নি।');}};synth.speak(utterance);}next();};$('voice').onchange=stopSpeech;if(synth)synth.addEventListener('voiceschanged',voices);window.addEventListener('pagehide',()=>{stopSpeech();if(modelURL)URL.revokeObjectURL(modelURL);});
viewer.addEventListener('load',async()=>{const clips=viewer.availableAnimations||[];if(clips.length){viewer.animationName=clips[0];await viewer.updateComplete;viewer.pause();viewer.currentTime=0;}$('status').textContent=clips.length?'':tr('This model has no animation tracks.','এই মডেলে অ্যানিমেশন নেই।');});viewer.addEventListener('error',()=>{$('status').textContent=tr('Model could not load. Check the GLB file and internet connection.','মডেল লোড হয়নি। GLB ফাইল ও ইন্টারনেট সংযোগ পরীক্ষা করুন।');});
function tick(){const has=(viewer.availableAnimations||[]).length>0,t=viewer.currentTime||0,d=viewer.duration||0;for(const id of ['play','seek','speed'])$(id).disabled=!has;$('seek').max=d||1;$('seek').value=t;$('time').textContent=t.toFixed(1)+' / '+d.toFixed(1)+' s';$('play').textContent=viewer.paused?tr('▶ Play','▶ চালু'):tr('❚❚ Pause','❚❚ বিরতি');if(endAt!==null&&t>=endAt-.025){viewer.pause();viewer.currentTime=endAt;endAt=null;}requestAnimationFrame(tick);}render();requestAnimationFrame(tick);
function combineGLB(buffer, requestedScene){
 const input=new Uint8Array(buffer),dv=new DataView(buffer);
 if(input.length<20||dv.getUint32(0,true)!==0x46546c67||dv.getUint32(4,true)!==2||dv.getUint32(8,true)!==input.length)throw Error('Invalid GLB 2.0 file.');
 const chunks=[];let at=12;
 while(at<input.length){if(at+8>input.length)throw Error('Truncated GLB chunk.');const n=dv.getUint32(at,true),type=dv.getUint32(at+4,true);if(at+8+n>input.length)throw Error('Truncated GLB data.');chunks.push({type,data:input.slice(at+8,at+8+n)});at+=8+n;}
 if(chunks[0]?.type!==0x4e4f534a)throw Error('Missing GLB JSON.');
 const doc=JSON.parse(new TextDecoder().decode(chunks[0].data)),clips=doc.animations||[];
 const scenes=doc.scenes||[];
 let sceneIndex=Number.isInteger(requestedScene)&&scenes[requestedScene]?requestedScene:(doc.scene??0);
 if(!scenes[sceneIndex])throw Error('GLB has no valid scene.');
 const active=new Set(),walk=n=>{if(active.has(n))return;active.add(n);for(const c of doc.nodes?.[n]?.children||[])walk(c);};
 for(const n of scenes[sceneIndex].nodes||[])walk(n);
 const sceneNames=scenes.map((s,i)=>s.name||'Scene '+(i+1));let relevantClips=0;
 doc.scenes=[scenes[sceneIndex]];doc.scene=0;
 const out={name:'Full_Lesson_Animation',samplers:[],channels:[]},seen=new Map();
 for(const clip of clips){if((clip.channels||[]).some(c=>active.has(c.target?.node)))relevantClips++;for(const channel of clip.channels||[]){
 if(Number.isInteger(channel.target?.node)&&!active.has(channel.target.node))continue;
  if(channel.target?.extensions||!Number.isInteger(channel.target?.node))throw Error('This animation uses an unsupported target extension.');
  const key=channel.target.node+':'+channel.target.path,sampler=clip.samplers[channel.sampler];
  if(!sampler)throw Error('Invalid animation sampler.');
  const signature=JSON.stringify([sampler.input,sampler.output,sampler.interpolation||'LINEAR']);
  if(seen.has(key)){if(seen.get(key)===signature)continue;throw Error('Cannot safely combine: multiple clips animate the same property of '+(doc.nodes?.[channel.target.node]?.name||key)+'. These are alternative actions. Export Blender using Scene animation with Split by Object off.');}
  seen.set(key,signature);out.channels.push({...channel,sampler:out.samplers.length});out.samplers.push(sampler);
 }}
 
 doc.animations=out.channels.length?[out]:[];const encoded=new TextEncoder().encode(JSON.stringify(doc)),padded=new Uint8Array(Math.ceil(encoded.length/4)*4);padded.fill(32);padded.set(encoded);chunks[0].data=padded;
 const size=12+chunks.reduce((n,c)=>n+8+c.data.length,0),result=new ArrayBuffer(size),v=new DataView(result),bytes=new Uint8Array(result);
 v.setUint32(0,0x46546c67,true);v.setUint32(4,2,true);v.setUint32(8,size,true);at=12;
 for(const c of chunks){v.setUint32(at,c.data.length,true);v.setUint32(at+4,c.type,true);bytes.set(c.data,at+8);at+=8+c.data.length;}
 return {bytes:result,clips:relevantClips,totalClips:clips.length,channels:out.channels.length,sceneNames,sceneIndex};
}
customElements.whenDefined('model-viewer').then(async()=>{
 try{
 $('status').textContent='Loading model and synchronizing animation…';let buffer;
 if(m.embeddedGLB){const b=atob(m.embeddedGLB),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);buffer=a.buffer;}
 else{if(location.protocol==='file:')throw Error('Open this separate-GLB page through localhost or GitHub Pages; double-click file access cannot fetch the model.');const r=await fetch(m.src);if(!r.ok)throw Error('GLB request failed: HTTP '+r.status+' — '+m.src);buffer=await r.arrayBuffer();}
 const result=combineGLB(buffer,m.sceneIndex);modelURL=URL.createObjectURL(new Blob([result.bytes],{type:'model/gltf-binary'}));viewer.src=modelURL;
 }catch(e){$('status').textContent=e.message;}
});setTimeout(()=>{if(!customElements.get('model-viewer'))$('status').textContent=tr('Internet is required to load the 3D viewer. Reconnect and reload.','৩ডি ভিউয়ার লোড করতে ইন্টারনেট প্রয়োজন। সংযোগ দিয়ে আবার খুলুন।');},12000);
