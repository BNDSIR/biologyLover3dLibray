<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Lesson</title><script type="module" src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#091e2c;color:#eef9ff;font:16px system-ui,'Nirmala UI',sans-serif}header{padding:18px}h1{margin:0 0 12px}button,select{font:inherit;padding:10px;border:1px solid #658591;background:#204457;color:white;border-radius:9px;cursor:pointer}button:disabled{opacity:.45}.bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}main{display:grid;grid-template-columns:minmax(0,1fr) 340px}main.wide{grid-template-columns:1fr}model-viewer{width:100%;height:72vh;min-height:350px;background:radial-gradient(ellipse,#426274,#152c3b)}aside{padding:20px;max-height:80vh;overflow:auto;background:#102f40}p{line-height:1.65;white-space:pre-wrap}.hot{background:white;color:#173746;padding:6px;font-size:13px}#parts button{display:block;margin:8px 0;width:100%;text-align:left}[hidden]{display:none!important}#status{font-size:14px;color:#c0dbe6}button:focus-visible{outline:3px solid #ffd37e}@media(max-width:740px){main{grid-template-columns:1fr}model-viewer{height:58vh}aside{max-height:none}}</style>
<header><h1 id="heading"></h1><div class="bar"><button id="lang">বাংলা</button><button id="details"></button><button id="rotate"></button><button id="reset"></button><button id="play" disabled></button><select id="clips" hidden aria-label="Animation"></select></div><div id="status" role="status"></div></header><main id="layout"><model-viewer id="viewer" camera-controls touch-action="pan-y" shadow-intensity="0.3"></model-viewer><aside id="panel"><button id="close" aria-label="Close details">×</button><h2 id="title"></h2><p id="description"></p><div class="bar"><button id="listen"></button><button id="stop"></button></div><label id="voiceLabel" for="voice"></label><select id="voice" style="width:100%"></select><p id="speechStatus" role="status"></p><div id="parts"></div></aside></main>
<footer id="copyright" style="padding:20px;text-align:center;color:#b6d4df;border-top:1px solid #345363"></footer><script id="lesson" type="application/json">{"id":"model-1790527660448","src":"chromosome.glb","title":{"en":"Chromosome","bn":"ক্রোমোজোমের ভৌত গঠন "},"description":{"en":"","bn":"মাইটোসিস কোষ বিভাজনের মেটাফেজ ধাপে ক্রোমোজোমগুলোকে সবচেয়ে স্পষ্ট, স্থূল ও দণ্ডাকার ভৌত গঠন হিসেবে দেখা যায়। একটি আদর্শ ক্রোমোজোমের ভৌত গঠনে নিচের প্রধান অংশগুলো থাকে: [1] \n\n* পেলিকল (Pellicle): এটি ক্রোমোজোমকে ঘিরে থাকা সবচেয়ে বাইরের পাতলা ও জেলি সদৃশ আবরণী। [2] \n* ম্যাট্রিক্স (Matrix): পেলিকলের ভেতরে থাকা তরল ও জেলীযুক্ত বস্তু, যার মধ্যে ক্রোমাটোনেমা বা ক্রোমনিমাগুলো অবস্থান করে।\n* ক্রোমাটোনেমা (Chromonema): ম্যাট্রিক্সের ভেতরে থাকা অত্যন্ত সূক্ষ্ম, কুন্ডলী পাকানো ও সুতার মতো অংশ। কোষ বিভাজনের সময় এগুলো আরও ঘনীভূত হয়।\n* সেন্ট্রোমিয়ার (Centromere): ক্রোমোজোমের যে নির্দিষ্ট স্থানে দুটি সিস্টার ক্রোমাটিড যুক্ত থাকে তাকে সেন্ট্রোমিয়ার বলে। একে মুখ্য কুঞ্চনও বলা হয়। এখানেই কাইনেটোকোর (Kinetochore) নামক প্রোটিন কাঠামো থাকে যা বেম তন্তুর সাথে যুক্ত হয়। [3, 4] \n* ক্রোমাটিড (Chromatid): সেন্ট্রোমিয়ার দ্বারা সংযুক্ত ক্রোমোজোমের লম্বালম্বি দুটি সমান বাহু বা অর্ধাংশ। [3, 5] \n* টেলোমেয়ার (Telomere): ক্রোমোজোমের দুই প্রান্তের শেষ অংশকে টেলোমেয়ার বলে। এটি ক্রোমোজোমের প্রান্তগুলোকে পরস্পরের সাথে যুক্ত হতে বাধা দেয় এবং এর অখণ্ডতা বজায় রাখে। [5, 6] \n* গৌণ কুঞ্চন ও স্যাটেলাইট (Secondary Constriction and Satellite): সেন্ট্রোমিয়ার ছাড়াও কিছু ক্রোমোজোমে অন্য এক বা একাধিক স্থানে কুঞ্চন দেখা যায় যাকে গৌণ কুঞ্চন বলে। গৌণ কুঞ্চনের ঠিক শেষ প্রান্তে অবস্থিত মটর দানার মতো ছোট অংশকে স্যাটেলাইট বলে।\n* নিউক্লিওলার অর্গেনাইজার (Nucleolar Organizer): গৌণ কুঞ্চন অঞ্চলটি অনেক সময় নিউক্লিওলাস গঠনে সাহায্য করে, তাই একে নিউক্লিওলার অর্গেনাইজার রিজিয়ন বলে।\n\n"},"labels":[],"copyright":"© 2026 Bholanath Debnath. All rights reserved."}</script><script>
const $=id=>document.getElementById(id),m=JSON.parse($('lesson').textContent),viewer=$('viewer');let language='en',selected=-1,open=true,queue=[],token=0,utterance;
const tr=(en,bn)=>language==='en'?en:bn,tx=o=>o[language]||o.en||o.bn||'',synth=window.speechSynthesis;
function stop(){token++;queue=[];if(synth)synth.cancel();$('speechStatus').textContent='';}
function voices(){const list=synth?synth.getVoices().filter(v=>v.lang.toLowerCase().startsWith(language)):[];list.sort((a,b)=>Number(/Google/i.test(b.name))-Number(/Google/i.test(a.name)));$('voice').replaceChildren();list.forEach(v=>$('voice').add(new Option(v.name+' ('+v.lang+')',v.voiceURI)));$('listen').disabled=!list.length;if(!list.length)$('speechStatus').textContent=tr('No English voice is available on this device.','এই ডিভাইসে বাংলা কণ্ঠস্বর পাওয়া যায়নি।');else $('speechStatus').textContent='';}
function render(){$('copyright').textContent=m.copyright||'© 2026 Bholanath Debnath. All rights reserved.';document.documentElement.lang=language;document.title=tx(m.title);$('heading').textContent=tx(m.title);$('lang').textContent=language==='en'?'বাংলা':'English';$('details').textContent=open?tr('Hide details','বিবরণ লুকান'):tr('Show details','বিবরণ দেখান');$('rotate').textContent=tr('Rotate','ঘোরান');$('reset').textContent=tr('Reset','আগের দৃশ্য');$('play').textContent=tr('Play / pause','চালু / বিরতি');$('listen').textContent=tr('Listen','শুনুন');$('stop').textContent=tr('Stop audio','শোনা বন্ধ');$('voiceLabel').textContent=tr('Voice','কণ্ঠস্বর');$('panel').hidden=!open;$('layout').classList.toggle('wide',!open);const h=m.labels[selected]||m;$('title').textContent=tx(h.title);$('description').textContent=tx(h.description);$('parts').replaceChildren();viewer.querySelectorAll('button').forEach(b=>b.remove());m.labels.forEach((h,i)=>{const b=document.createElement('button');b.textContent=tx(h.title);b.onclick=()=>choose(i);$('parts').append(b);const hot=document.createElement('button');hot.textContent=tx(h.title);hot.className='hot';hot.slot='hotspot-'+i;hot.dataset.position=h.position;hot.dataset.normal=h.normal;hot.onclick=()=>choose(i);viewer.append(hot);});voices();}
function choose(i){stop();selected=i;open=true;render();}
$('lang').onclick=()=>{stop();language=language==='en'?'bn':'en';render();};$('details').onclick=()=>{open=!open;render();};$('close').onclick=()=>{open=false;render();};$('rotate').onclick=()=>viewer.autoRotate=!viewer.autoRotate;$('reset').onclick=()=>{stop();selected=-1;viewer.autoRotate=false;viewer.cameraOrbit='auto auto auto';viewer.cameraTarget='auto auto auto';viewer.fieldOfView='auto';render();};$('play').onclick=()=>viewer.paused?viewer.play():viewer.pause();$('clips').onchange=e=>{viewer.animationName=e.target.value;viewer.play();};$('stop').onclick=stop;
$('listen').onclick=()=>{stop();const h=m.labels[selected]||m;const text=tx(h.title)+'. '+tx(h.description);const chosen=synth.getVoices().find(v=>v.voiceURI===$('voice').value);if(!chosen)return;queue=text.match(/[^.!?।\n]+[.!?।\n]*/g)||[text];queue=queue.flatMap(s=>s.match(/.{1,180}(?:\s|$)|.{1,180}/g)||[]);const run=token;function next(){if(run!==token)return;const chunk=queue.shift();if(!chunk){$('speechStatus').textContent=tr('Finished.','শেষ।');return;}utterance=new SpeechSynthesisUtterance(chunk);utterance.voice=chosen;utterance.lang=chosen.lang;utterance.rate=0.9;utterance.onend=next;utterance.onerror=e=>{if(run===token)$('speechStatus').textContent=tr('Speech unavailable: ','কণ্ঠস্বর চালু হয়নি: ')+e.error;};synth.speak(utterance);}next();};if(synth)synth.addEventListener('voiceschanged',voices);window.addEventListener('pagehide',stop);
viewer.addEventListener('load',()=>{$('status').textContent=tr('Drag to rotate. Tap labels for details.','ঘোরাতে টানুন। বিবরণ দেখতে লেবেল চাপুন।');const clips=viewer.availableAnimations||[];$('play').disabled=!clips.length;$('clips').hidden=clips.length<2;$('clips').replaceChildren();clips.forEach(c=>$('clips').add(new Option(c,c)));});viewer.addEventListener('error',()=>{$('status').textContent=tr('Model could not load. Check the published GLB path.','মডেল লোড হয়নি। প্রকাশিত GLB পাথ পরীক্ষা করুন।');});render();customElements.whenDefined('model-viewer').then(()=>{viewer.src=m.src;viewer.alt=tx(m.title);});setTimeout(()=>{if(!customElements.get('model-viewer'))$('status').textContent=tr('Connect to the internet and reload to load the viewer.','ভিউয়ার খুলতে ইন্টারনেট সংযোগ দিয়ে আবার খুলুন।');},12000);
</script></html>
